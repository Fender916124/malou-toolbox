<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>马喽工具箱</title>

<link rel="stylesheet" href="common.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--c-bg);
  color: var(--c-text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* ── 内容容器 ── */
.container {
  text-align: center;
  z-index: 1;
  animation: fadeUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── 标题区 ── */
.logo-deco {
  font-size: 36px;
  margin-bottom: 16px;
  display: inline-block;
  width: 64px; height: 64px; line-height: 64px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 14px;
  text-align: center;
}

.main-title {
  font-size: 40px;
  font-weight: 700;
  color: var(--c-text);
  letter-spacing: -0.5px;
  line-height: 1.2;
  margin-bottom: 8px;
}
.main-title .accent {
  color: var(--c-accent);
}
.subtitle {
  font-size: 15px;
  color: var(--c-text-secondary);
  letter-spacing: 0.5px;
  margin-bottom: 48px;
  font-weight: 400;
}
.divider {
  width: 32px;
  height: 2px;
  background: var(--c-border-hover);
  margin: 0 auto 48px;
  border-radius: 1px;
}

/* ── 工具卡片 ── */
.cards {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

.card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 260px;
  height: 180px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  text-decoration: none;
  color: var(--c-text);
  transition: all var(--transition);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 12px; right: 12px;
  height: 3px;
  border-radius: 0 0 2px 2px;
  transition: all var(--transition);
  opacity: 0;
}

.card-xhs::before { background: var(--c-red); }
.card-wechat::before { background: var(--c-accent); }

.card:hover {
  transform: translateY(-4px);
  border-color: var(--c-border-hover);
  box-shadow: var(--shadow-md);
}

.card:hover::before {
  opacity: 1;
}

.card:active {
  transform: translateY(-1px);
}

.card-icon {
  font-size: 44px;
  margin-bottom: 16px;
  transition: transform var(--transition);
}

.card:hover .card-icon {
  transform: scale(1.06);
}

.card-title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0;
  margin-bottom: 4px;
  color: var(--c-text);
}

.card-desc {
  font-size: 13px;
  color: var(--c-text-secondary);
  letter-spacing: 0;
  font-weight: 400;
}

/* ── 页脚 ── */
.footer {
  position: absolute;
  bottom: 28px;
  font-size: 12px;
  color: var(--c-text-tertiary);
  letter-spacing: 0.5px;
  z-index: 1;
}

/* ── 响应式 ── */
@media (max-width: 600px) {
  .main-title { font-size: 28px; letter-spacing: 0; }
  .subtitle { font-size: 14px; margin-bottom: 36px; }
  .divider { margin-bottom: 36px; }
  .cards { gap: 14px; }
  .card { width: 200px; height: 150px; }
  .card-icon { font-size: 36px; margin-bottom: 12px; }
  .card-title { font-size: 15px; }
  .card-desc { font-size: 12px; }
  .logo-deco { font-size: 28px; width: 52px; height: 52px; line-height: 52px; }
}
</style>
</head>
<body>

  <!-- 内容 -->
  <div class="container">
    <div class="logo-deco">🛠️</div>
    <h1 class="main-title">
      <span class="accent">马喽</span>工具箱
    </h1>
    <p class="subtitle">内容创作 · 一键排版</p>
    <div class="divider"></div>

    <div class="cards">
      <a href="xhs.html" class="card card-xhs">
        <div class="card-icon">📱</div>
        <div class="card-title">小红书工作台</div>
        <div class="card-desc">卡片生成 · 图文排版</div>
      </a>
      <a href="wechat.html" class="card card-wechat">
        <div class="card-icon">📰</div>
        <div class="card-title">公众号排版工作台</div>
        <div class="card-desc">Markdown · 公众号转换</div>
      </a>
    </div>
  </div>

  <div class="footer">马喽工具箱 · 让创作更简单</div>

</body>
</html>
