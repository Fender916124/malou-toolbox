<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>马喽工具箱</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: #f5f2ed;
  color: #3a3a3a;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* ── 背景装饰 ── */
.bg-deco {
  position: absolute;
  border-radius: 50%;
  opacity: 0.04;
  pointer-events: none;
}
.bg-deco-1 {
  width: 600px; height: 600px;
  background: #c4a97e;
  top: -200px; left: -150px;
}
.bg-deco-2 {
  width: 400px; height: 400px;
  background: #b3534a;
  bottom: -100px; right: -80px;
}
.bg-deco-3 {
  width: 200px; height: 200px;
  background: #c4a97e;
  bottom: 30%; right: 10%;
}

/* ── 内容容器 ── */
.container {
  text-align: center;
  z-index: 1;
  animation: fadeUp 0.8s ease-out;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── 标题区 ── */
.logo-deco {
  font-size: 42px;
  margin-bottom: 10px;
  letter-spacing: 6px;
}
.main-title {
  font-size: 64px;
  font-weight: 800;
  color: #3a3a3a;
  letter-spacing: 8px;
  line-height: 1.2;
  margin-bottom: 16px;
}
.main-title .accent {
  color: #c4a97e;
}
.subtitle {
  font-size: 18px;
  color: #a09888;
  letter-spacing: 6px;
  margin-bottom: 60px;
  font-weight: 300;
}
.divider {
  width: 60px;
  height: 3px;
  background: #c4a97e;
  margin: 0 auto 60px;
  border-radius: 2px;
}

/* ── 工具卡片 ── */
.cards {
  display: flex;
  gap: 32px;
  justify-content: center;
  flex-wrap: wrap;
}

.card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 240px;
  height: 200px;
  background: #fff;
  border-radius: 12px;
  text-decoration: none;
  color: #3a3a3a;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  transition: all 0.25s ease;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  transition: height 0.25s ease;
}

.card-xhs::before {
  background: #b3534a;
}
.card-wechat::before {
  background: #c4a97e;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 32px rgba(0,0,0,0.1);
}

.card:hover::before {
  height: 6px;
}

.card:active {
  transform: translateY(-2px);
}

.card-icon {
  font-size: 52px;
  margin-bottom: 14px;
  transition: transform 0.25s ease;
}

.card:hover .card-icon {
  transform: scale(1.1);
}

.card-title {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 2px;
  margin-bottom: 4px;
}

.card-desc {
  font-size: 13px;
  color: #a09888;
  letter-spacing: 1px;
}

/* ── 页脚 ── */
.footer {
  position: absolute;
  bottom: 32px;
  font-size: 13px;
  color: #d0c8b8;
  letter-spacing: 2px;
  z-index: 1;
}

/* ── 响应式 ── */
@media (max-width: 600px) {
  .main-title { font-size: 40px; letter-spacing: 4px; }
  .subtitle { font-size: 15px; letter-spacing: 4px; margin-bottom: 40px; }
  .divider { margin-bottom: 40px; }
  .cards { gap: 20px; }
  .card { width: 180px; height: 160px; }
  .card-icon { font-size: 40px; }
  .card-title { font-size: 17px; }
  .logo-deco { font-size: 32px; }
}
</style>
</head>
<body>

  <!-- 背景装饰 -->
  <div class="bg-deco bg-deco-1"></div>
  <div class="bg-deco bg-deco-2"></div>
  <div class="bg-deco bg-deco-3"></div>

  <!-- 内容 -->
  <div class="container">
    <div class="logo-deco">🛠️</div>
    <h1 class="main-title">
      <span class="accent">马喽</span>工具箱
    </h1>
    <p class="subtitle">内容创作 · 一键排版</p>
    <div class="divider"></div>

    <div class="cards">
      <a href="xhs.html" class="card card-xhs">
        <div class="card-icon">📱</div>
        <div class="card-title">小红书工作台</div>
        <div class="card-desc">卡片生成 · 图文排版</div>
      </a>
      <a href="wechat.html" class="card card-wechat">
        <div class="card-icon">📰</div>
        <div class="card-title">公众号排版工作台</div>
        <div class="card-desc">Markdown · 公众号转换</div>
      </a>
    </div>
  </div>

  <div class="footer">马喽工具箱 · 让创作更简单</div>

</body>
</html>
